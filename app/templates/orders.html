{% extends "base.html" %}
{% block title %}My Orders{% endblock %}
{% block content %}
<h3 class="mb-3">My Orders</h3>
<div id="orders-list"></div>
{% endblock %}
{% block scripts %}
<script>
async function loadOrders() {
  const list = document.getElementById('orders-list');
  if (!getToken()) {
    list.innerHTML = '<p class="text-muted">Please <a href="/">log in</a> to see your orders.</p>';
    return;
  }
  try {
    const orders = await apiFetch('/api/orders/my');
    if (!orders.length) {
      list.innerHTML = '<p class="text-muted">No orders yet.</p>';
      return;
    }
    list.innerHTML = orders.map(o => `
      <div class="card p-3 mb-3">
        <div class="d-flex justify-content-between align-items-center">
          <strong>Order #${o.id}</strong>
          <span class="badge status-badge status-${o.status}">${o.status}</span>
        </div>
        <div class="mt-2">
          ${o.items.map(i => `<div>Item #${i.menu_item_id} × ${i.quantity}</div>`).join('')}
        </div>
        <div class="mt-2 fw-bold">Total: ₹${o.total_amount.toFixed(2)}</div>
        ${o.status === 'PAYMENT_FAILED' || o.status === 'PAYMENT_PENDING'
          ? `<button class="btn btn-sm btn-outline-danger mt-2" onclick="cancelOrder(${o.id})">Cancel</button>`
          : ''}
      </div>
    `).join('');
  } catch (err) {
    list.innerHTML = `<p class="text-danger">${err.message}</p>`;
  }
}

async function cancelOrder(orderId) {
  try {
    await apiFetch(`/api/orders/${orderId}/cancel`, { method: 'PATCH' });
    loadOrders();
  } catch (err) {
    alert(err.message);
  }
}

loadOrders();
</script>
{% endblock %}
