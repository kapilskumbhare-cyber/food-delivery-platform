<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Food Delivery Platform{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="/restaurants">FoodDelivery</a>
    <div class="navbar-nav ms-auto flex-row gap-3" id="nav-links">
      <a class="nav-link text-light" href="/restaurants">Browse</a>
      <a class="nav-link text-light" href="/cart">Cart</a>
      <a class="nav-link text-light" href="/orders">My Orders</a>
      <a class="nav-link text-light d-none" href="/my-restaurant" id="nav-my-restaurant">My Restaurant</a>
      <a class="nav-link text-light" href="#" id="nav-logout">Logout</a>
      <a class="nav-link text-light" href="/" id="nav-login">Login</a>
    </div>
  </nav>

  <div class="container py-4">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script>
    // Show/hide nav items based on auth state
    const token = getToken();
    const role = getRole();
    document.getElementById('nav-login').classList.toggle('d-none', !!token);
    document.getElementById('nav-logout').classList.toggle('d-none', !token);
    if (role === 'restaurant') {
      document.getElementById('nav-my-restaurant').classList.remove('d-none');
    }
    document.getElementById('nav-logout').addEventListener('click', (e) => {
      e.preventDefault();
      logout();
      window.location.href = '/';
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
